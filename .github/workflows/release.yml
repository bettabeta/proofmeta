# Publishes @proofmeta packages via npm trusted publishing (OIDC). No npm token
# is used or accepted. Requires, per package on npmjs.com: trusted publisher =
# this repository, workflow `release.yml`, environment `npm-publish`.
#
# Two triggers, same publish path:
# - a pushed tag `<package>@<version>` (e.g. `cli@0.5.1`) publishes that package;
# - a push to main that raises `version` in a releasable package.json publishes
#   every raised package in dependency order, then tags the pushed commit.
# Tags created here use GITHUB_TOKEN and therefore do not start another run.
# A version already on npm from this exact commit is skipped, so a failed run
# can be re-run after a partial publish.
name: release

on:
  push:
    branches:
      - main
    paths:
      - packages/spec/package.json
      - packages/sdk-ts/package.json
      - packages/resolvers/free/package.json
      - packages/cli/package.json
    tags:
      - 'spec@*'
      - 'sdk-ts@*'
      - 'resolver-free@*'
      - 'cli@*'

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tags: ${{ steps.plan.outputs.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Commit must be on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Plan release tags
        id: plan
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          node scripts/release-plan.mjs >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  publish:
    needs: plan
    if: needs.plan.outputs.tags != ''
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Bounded install (docs/INSTALL.md)
        run: |
          node scripts/version-p1-install-smoke.mjs --preinstall
          npm ci --ignore-scripts --no-audit
          node scripts/version-p1-install-smoke.mjs
          npm run build

      - name: Full suite
        run: |
          npm test
          node --test scripts/test/*.test.mjs
          npm audit

      - name: Publish
        env:
          TAGS: ${{ needs.plan.outputs.tags }}
          SHA: ${{ github.sha }}
        run: |
          for tag in $TAGS; do
            release=$(node scripts/release-tag.mjs "$tag")
            name=$(sed -n 's/^name=//p' <<<"$release")
            version=$(sed -n 's/^version=//p' <<<"$release")
            dist_tag=$(sed -n 's/^dist_tag=//p' <<<"$release")
            deps=$(sed -n 's/^internal_dependencies=//p' <<<"$release")

            code=0
            out=$(npm view "$name@$version" version --prefer-online 2>&1) || code=$?
            if [ "$code" -eq 0 ] && [ -n "$out" ]; then
              head=$(npm view "$name@$version" gitHead --prefer-online)
              if [ "$head" = "$SHA" ]; then
                echo "::notice::$name@$version is already on npm from $SHA; skipping"
                continue
              fi
              echo "::error::$name@$version is already on npm (gitHead ${head:-missing})"
              exit 1
            fi
            if [ "$code" -ne 0 ] && ! grep -q E404 <<<"$out"; then
              echo "::error::npm view failed: $out"
              exit 1
            fi

            # A dependency published earlier in this loop can take a few minutes to appear.
            for spec in $deps; do
              for attempt in $(seq 1 20); do
                if [ -n "$(npm view "$spec" version --prefer-online 2>/dev/null)" ]; then
                  continue 2
                fi
                sleep 15
              done
              echo "::error::$spec is not on npm yet; publish it first, then re-run this job"
              exit 1
            done

            npm publish -w "$name" --provenance --access public --tag "$dist_tag"
          done

  tag:
    needs: [plan, publish]
    if: github.ref_type == 'branch' && needs.plan.outputs.tags != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Tag the released commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAGS: ${{ needs.plan.outputs.tags }}
          SHA: ${{ github.sha }}
        run: |
          for tag in $TAGS; do
            if existing=$(gh api "repos/$REPO/git/ref/tags/$tag" --jq .object.sha 2>/dev/null); then
              if [ "$existing" = "$SHA" ]; then
                echo "$tag already points at $SHA"
                continue
              fi
              echo "::error::tag $tag already points at $existing, not $SHA"
              exit 1
            fi
            gh api "repos/$REPO/git/refs" -f ref="refs/tags/$tag" -f sha="$SHA" > /dev/null
            echo "created $tag at $SHA"
          done
