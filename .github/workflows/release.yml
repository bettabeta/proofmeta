# Publishes one package per pushed tag `<package>@<version>` (e.g. `cli@0.5.1`)
# via npm trusted publishing (OIDC). No npm token is used or accepted.
# Requires, per package on npmjs.com: trusted publisher = this repository,
# workflow `release.yml`, environment `npm-publish`.
# Tags for dependent packages (cli) only publish once their @proofmeta
# dependencies satisfy the declared range on npm; re-run the job afterwards.
name: release

on:
  push:
    tags:
      - 'spec@*'
      - 'sdk-ts@*'
      - 'resolver-free@*'
      - 'cli@*'

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Tag commit must be on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Resolve package from tag
        id: release
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/release-tag.mjs "$TAG" >> "$GITHUB_OUTPUT"

      - name: Version must not exist on npm
        env:
          NAME: ${{ steps.release.outputs.name }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          code=0
          out=$(npm view "$NAME@$VERSION" version 2>&1) || code=$?
          if [ "$code" -eq 0 ] && [ -n "$out" ]; then
            echo "::error::$NAME@$VERSION is already on npm"
            exit 1
          fi
          if [ "$code" -ne 0 ] && ! grep -q E404 <<<"$out"; then
            echo "::error::npm view failed: $out"
            exit 1
          fi

      - name: '@proofmeta dependencies must already be on npm'
        env:
          DEPS: ${{ steps.release.outputs.internal_dependencies }}
        run: |
          for spec in $DEPS; do
            if [ -z "$(npm view "$spec" version)" ]; then
              echo "::error::$spec is not on npm yet; publish it first, then re-run this job"
              exit 1
            fi
          done

      - name: Bounded install (docs/INSTALL.md)
        run: |
          node scripts/version-p1-install-smoke.mjs --preinstall
          npm ci --ignore-scripts --no-audit
          node scripts/version-p1-install-smoke.mjs
          npm run build

      - name: Full suite
        run: |
          npm test
          node --test scripts/test/*.test.mjs
          npm audit

      - name: Publish
        env:
          NAME: ${{ steps.release.outputs.name }}
          DIST_TAG: ${{ steps.release.outputs.dist_tag }}
        run: npm publish -w "$NAME" --provenance --access public --tag "$DIST_TAG"
