name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["18.x", "20.x", "22.x"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: PRE
        run: node scripts/version-p1-install-smoke.mjs --preinstall

      - name: Install
        run: npm ci --ignore-scripts --no-audit

      - name: Post-install smoke
        run: node scripts/version-p1-install-smoke.mjs

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
        env:
          NODE_OPTIONS: ${{ matrix.node-version == '18.x' && '--experimental-global-webcrypto' || '' }}

      - name: Site manifest
        run: node --test scripts/test/site-manifest.test.mjs
        env:
          NODE_OPTIONS: ${{ matrix.node-version == '18.x' && '--experimental-global-webcrypto' || '' }}

      - name: E2E supervisor
        run: node --test scripts/test/e2e-supervisor.test.mjs
        env:
          NODE_OPTIONS: ${{ matrix.node-version == '18.x' && '--experimental-global-webcrypto' || '' }}

      - name: Audit
        run: npm audit --audit-level=high
